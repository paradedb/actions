name: lint-format
description: Check tracked file endings, whitespace, and optionally JSON validity.
inputs:
  exclude:
    description: Newline-separated Git pathspecs excluded from whitespace and final-newline checks.
    required: false
    default: ""
  check-json:
    description: Validate all tracked JSON files.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Check File Format
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/check.py"
      env:
        FORMAT_EXCLUDE: ${{ inputs.exclude }}
        CHECK_JSON: ${{ inputs.check-json }}
