name: lint-prettier
description: Check YAML or Markdown with locked Prettier and markdownlint dependencies.
inputs:
  patterns:
    description: Newline-separated Prettier file patterns.
    required: false
    default: "**/*.{yml,yaml}"
  markdown:
    description: Also run markdownlint on Markdown files.
    required: false
    default: "false"
  prettier-source:
    description: "Use shared dependencies or the caller pnpm lockfile: shared or pnpm."
    required: false
    default: shared
  ignore-path:
    description: Optional explicit Prettier ignore file; empty uses Prettier defaults.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set Up pnpm
      uses: pnpm/action-setup@v6
      if: inputs.prettier-source == 'pnpm'
    - name: Set Up NodeJS Environment
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "24"
    - name: Install Locked Lint Dependencies
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
    - name: Install Locked Repository Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      if: inputs.prettier-source == 'pnpm'
    - name: Run Linters
      shell: bash
      run: node "$GITHUB_ACTION_PATH/lint.mjs"
      env:
        LINT_PATTERNS: ${{ inputs.patterns }}
        LINT_MARKDOWN: ${{ inputs.markdown }}
        PRETTIER_SOURCE: ${{ inputs.prettier-source }}
        PRETTIER_IGNORE_PATH: ${{ inputs.ignore-path }}
