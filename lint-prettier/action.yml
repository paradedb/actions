name: lint-prettier
description: Check YAML or Markdown with pinned Prettier and markdownlint versions.
inputs:
  patterns:
    description: Newline-separated Prettier file patterns.
    required: false
    default: "**/*.{yml,yaml}"
  markdown:
    description: Also run markdownlint on Markdown files.
    required: false
    default: "false"
  prettier-source:
    description: "Use shared dependencies or the caller pnpm lockfile: shared or pnpm."
    required: false
    default: shared
  ignore-path:
    description: Optional explicit Prettier ignore file; empty uses Prettier defaults.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set Up pnpm
      uses: pnpm/action-setup@v6
      if: inputs.prettier-source == 'pnpm'
    - name: Set Up NodeJS Environment
      uses: actions/setup-node@v7
      with:
        node-version: "24"
    - name: Install Prettier and markdownlint
      shell: bash
      run: npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false --prefix "$GITHUB_ACTION_PATH" prettier@3.9.6 markdownlint-cli@0.49.1
    - name: Install Locked Repository Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      if: inputs.prettier-source == 'pnpm'
    - name: Run Markdown Lint
      if: inputs.markdown == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/node_modules/.bin/markdownlint" "**/*.md" --ignore "**/node_modules/**"'
    - name: Run Prettier
      shell: bash
      run: |
        patterns=()
        while IFS= read -r pattern; do
          pattern="${pattern%$'\r'}"
          if [[ -n "$pattern" ]]; then
            patterns+=("$pattern")
          fi
        done <<< "$LINT_PATTERNS"
        if [[ ${#patterns[@]} -eq 0 ]]; then
          echo "At least one Prettier pattern is required"
          exit 1
        fi
        args=(--check "${patterns[@]}")
        if [[ -n "$PRETTIER_IGNORE_PATH" ]]; then
          args+=(--ignore-path "$PRETTIER_IGNORE_PATH")
        fi
        case "$PRETTIER_SOURCE" in
          shared) "$GITHUB_ACTION_PATH/node_modules/.bin/prettier" "${args[@]}" ;;
          pnpm) pnpm exec prettier "${args[@]}" ;;
          *) echo "prettier-source must be shared or pnpm"; exit 1 ;;
        esac
      env:
        LINT_PATTERNS: ${{ inputs.patterns }}
        PRETTIER_SOURCE: ${{ inputs.prettier-source }}
        PRETTIER_IGNORE_PATH: ${{ inputs.ignore-path }}
