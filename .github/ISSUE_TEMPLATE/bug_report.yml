name: Bug report
description: Report a problem with a shared action or workflow.
labels:
  - bug
body:
  - type: input
    id: action
    attributes:
      label: Action or workflow
      description: Include the action or workflow name and its version or commit.
      placeholder: paradedb/actions/slack-alert@v13
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Include a minimal calling workflow and relevant inputs, without secrets.
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: Runner environment
      description: Include the operating system, architecture, and any job container.
      placeholder: ubuntu-latest, x64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or workflow run
      description: Include relevant logs or a link to the failing run, without secrets.
