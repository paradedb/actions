name: lint-pr-title
description: Validate conventional pull request titles.
inputs:
  github-token:
    description: "Token with pull-requests: read permission."
    required: true
runs:
  using: composite
  steps:
    - name: Validate PR Title Format
      uses: amannn/action-semantic-pull-request@v6
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
