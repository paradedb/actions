name: setup-terraform-lint
description: Install the shared Terraform and TFLint versions.
runs:
  using: composite
  steps:
    - name: Set Up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.15.9
    - name: Set Up TFLint
      uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a
      with:
        tflint_version: v0.64.0
