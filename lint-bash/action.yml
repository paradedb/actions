name: lint-bash
description: Check tracked shell scripts for formatting, shebangs, strict mode, and ShellCheck errors.
inputs:
  formatter:
    description: "Shell formatter: beautysh or shfmt."
    required: false
    default: beautysh
  allow-sh:
    description: Allow a /bin/sh shebang in addition to Bash.
    required: false
    default: "false"
  strict-mode-exclude:
    description: Newline-separated tracked paths exempt from the strict-mode check.
    required: false
    default: ""
  source-path:
    description: ShellCheck source search path.
    required: false
    default: scripts
runs:
  using: composite
  steps:
    - name: Set Up Python Environment
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install Shell Linters
      shell: bash
      run: |-
        python -m venv "$RUNNER_TEMP/paradedb-shell-lint"
        "$RUNNER_TEMP/paradedb-shell-lint/bin/pip" install beautysh==6.4.3 shellcheck-py==0.11.0.1
    - name: Install shfmt
      shell: bash
      run: |-
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64) arch=arm64 ;;
          *) echo "Unsupported runner architecture"; exit 1 ;;
        esac
        curl --fail --silent --show-error --location \
          "https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_${arch}" \
          --output "$RUNNER_TEMP/paradedb-shell-lint/bin/shfmt"
        chmod +x "$RUNNER_TEMP/paradedb-shell-lint/bin/shfmt"
      if: inputs.formatter == 'shfmt'
    - name: Check Shell Formatting
      shell: bash
      run: |
        case "$SHELL_FORMATTER" in
          beautysh) args=(--indent-size 2 --check --) ;;
          shfmt) args=(-d -i 2 -ci --) ;;
          *) echo "formatter must be beautysh or shfmt"; exit 1 ;;
        esac
        failed=0
        while IFS= read -r -d '' file; do
          # Match the existing **/*.sh formatter glob, which skips hidden paths.
          case "/$file" in */.*) continue ;; esac
          "$RUNNER_TEMP/paradedb-shell-lint/bin/$SHELL_FORMATTER" "${args[@]}" "./$file" || failed=1
        done < <(git ls-files -z '*.sh')
        exit "$failed"
      env:
        SHELL_FORMATTER: ${{ inputs.formatter }}
    - name: Check Shebangs and Strict Mode
      shell: bash
      run: |
        failed=0
        while IFS= read -r -d '' file; do
          shebang="$(head -n 1 -- "$file")"
          if [[ "$shebang" != '#!/bin/bash' && "$shebang" != '#!/usr/bin/env bash' ]]; then
            if [[ "$ALLOW_SH" != true || "$shebang" != '#!/bin/sh' ]]; then
              echo "Missing supported shebang: $file"
              failed=1
            fi
          fi
          if grep -Fxq -- "$file" <<< "$STRICT_MODE_EXCLUDE"; then
            continue
          fi
          if ! grep -Eq '^[[:blank:]]*set -E?euo pipefail$|^# @paradedb-skip-check-pipefail$' -- "$file"; then
            echo "Missing strict mode: $file"
            failed=1
          fi
        done < <(git ls-files -z '*.sh')
        exit "$failed"
      env:
        ALLOW_SH: ${{ inputs.allow-sh }}
        STRICT_MODE_EXCLUDE: ${{ inputs.strict-mode-exclude }}
    - name: Run ShellCheck
      shell: bash
      run: |
        failed=0
        while IFS= read -r -d '' file; do
          "$RUNNER_TEMP/paradedb-shell-lint/bin/shellcheck" -x -P "$SOURCE_PATH" -- "./$file" || failed=1
        done < <(git ls-files -z '*.sh')
        exit "$failed"
      env:
        SOURCE_PATH: ${{ inputs.source-path }}
