name: Promote Target Patch Branch
description: Approve and promote a resolved target patch branch.

inputs:
  branch_name:
    description: "Branch name to promote (must match target-patch-*)"
    required: true
  approvers:
    description: "Comma-separated list of GitHub usernames or org team slugs who can approve"
    required: true
  github_app_client_id:
    description: "The Client ID for the GitHub App"
    required: true
  github_app_private_key:
    description: Private key for the GitHub App.
    required: true
  slack_webhook_url:
    description: Slack incoming webhook URL. If empty, failure alerts are skipped.
    required: false
    default: ""
  username_mapping_github_to_slack:
    description: GitHub-to-Slack username mapping for failure alerts.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Generate GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@v3.2.0
      with:
        client-id: ${{ inputs.github_app_client_id }}
        private-key: ${{ inputs.github_app_private_key }}

    # Only the scripts are needed here; the promotion deepens this checkout to
    # the branches it actually touches. See upstream-sync/rebase/action.yml.
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: false

    - name: Extract Sync Configuration
      id: config
      shell: bash
      run: |
        source scripts/sync-upstream.sh
        {
          echo "upstream_repo_url=${UPSTREAM_REPO_URL:-}"
          echo "upstream_branch=${UPSTREAM_BRANCH:-main}"
          echo "target_branch=${TARGET_BRANCH:-main}"
        } >> "$GITHUB_OUTPUT"

    - name: Manual Approval Before Promotion
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ steps.app-token.outputs.token }}
        approvers: ${{ inputs.approvers }}
        minimum-approvals: 1
        issue-title: "Promote ${{ inputs.branch_name }} to ${{ steps.config.outputs.target_branch }}?"
        issue-body: |
          Please approve or deny the promotion of branch `${{ inputs.branch_name }}` to `${{ steps.config.outputs.target_branch }}`.

          From a local checkout of the target repository, run:
          ```console
          ./scripts/sync-upstream.sh range-diff ${{ inputs.branch_name }}
          ```
          ...to view the diff between this branch and `${{ steps.config.outputs.target_branch }}`.

    - name: Configure Git
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
      shell: bash
      run: |
        git config --global user.name "paradedb-github-app[bot]"
        git config --global user.email "282009505+paradedb-github-app[bot]@users.noreply.github.com"
        git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

    - name: Promote Branch to Main
      id: promote
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      shell: bash
      run: |
        set -euxo pipefail
        BRANCH_NAME="${{ inputs.branch_name }}"
        echo "Starting branch promotion process..."
        echo "Branch: $BRANCH_NAME"

        ./scripts/sync-upstream.sh promote "$BRANCH_NAME"

        echo "✅ Branch promotion completed successfully"
        echo "success=true" >> "$GITHUB_OUTPUT"
        echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

    - name: Notify Slack on Failure
      if: failure()
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
        USERNAME_MAPPING_GITHUB_TO_SLACK: ${{ inputs.username_mapping_github_to_slack }}
        APPROVERS: ${{ inputs.approvers }}
        ACTOR: ${{ github.actor }}
        REPO: ${{ github.repository }}
        WORKFLOW: ${{ github.workflow }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BRANCH_NAME: ${{ steps.promote.outputs.branch_name || inputs.branch_name || 'unknown' }}
      shell: bash
      run: |
        if [ -z "$SLACK_WEBHOOK_URL" ]; then
          echo "Slack webhook not configured, skipping notification"
          exit 0
        fi

        source scripts/sync-upstream.sh
        # `slack_mention_for_user` returns non-zero for an unmapped actor, and
        # sourcing the script above enables `set -e`, so guard the assignment or
        # the step aborts before curl and the alert is lost.
        SLACK_MENTION=$(slack_mention_for_user "$ACTOR" || true)

        JSON_DATA=$(jq -n \
          --arg mention "$SLACK_MENTION" \
          --arg repo "$REPO" \
          --arg branch "$BRANCH_NAME" \
          --arg workflow "$WORKFLOW" \
          --arg actor "$ACTOR" \
          --arg run_id "$RUN_ID" \
          --arg run_url "$RUN_URL" \
          '{
            text: ("🚨 Branch Promotion Failed - " + $mention),
            attachments: [{
              color: "danger",
              fields: [
                {title: "Repository", value: $repo, short: true},
                {title: "Branch", value: $branch, short: true},
                {title: "Workflow", value: $workflow, short: true},
                {title: "Triggered By", value: $actor, short: true},
                {title: "Run ID", value: $run_id, short: true},
                {title: "View Logs", value: ("<" + $run_url + "|Click here>"), short: false}
              ]
            }]
          }')

        # Slack answers "ok" on success and "invalid_payload" on a malformed body,
        # both over HTTP, so a rejected notification otherwise looks like a passing
        # step and the failure goes unannounced.
        RESPONSE=$(curl -sS -X POST -H 'Content-type: application/json' \
          --data "$JSON_DATA" "$SLACK_WEBHOOK_URL")
        if [ "$RESPONSE" != "ok" ]; then
          echo "Slack rejected the notification: $RESPONSE"
          echo "Payload was: $JSON_DATA"
          exit 1
        fi
